name: Build and Test Flutter APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Read-only unless a job asks for more. Only publishing the release needs to
# write, so only the build job is given it.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Keep in step with the Flutter used locally, or CI analyses and
          # tests against a different framework from the one developed on.
          flutter-version: '3.41.1'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: coverage/lcov.info
          fail_ci_if_error: false
        continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: test  # Only build if tests pass
    permissions:
      contents: write
    env:
      # Secrets cannot be tested in a step's `if:` directly, so whether the
      # upload key is configured is passed through the environment. It is
      # absent for pull requests from forks, and was absent from this
      # repository altogether when it was split from klator, which is why
      # every build failed reading an empty keystore.
      HAS_SIGNING_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      # Without key.properties Gradle signs with the debug key, so the build
      # still proves the app compiles for Android.
      - name: Build APK
        run: flutter build apk --release

      # Only from main, and only when the APK carries the upload key. A pull
      # request must never replace the public build, and an APK signed with
      # the debug key cannot update an install signed with the real one.
      - name: Create or Update Release (latest)
        if: github.event_name == 'push' && env.HAS_SIGNING_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: build/app/outputs/flutter-apk/app-release.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
